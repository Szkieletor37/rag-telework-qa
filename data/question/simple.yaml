# id: simple_005
# 資料 p.32
#   ## 9 テレワークにおける労働災害の補償
- question_id: "simple_005"
  category: "simple"
  question: "テレワークを行う労働者について発生した労働災害は、業務上の災害として労災保険給付の対象となりますか？"

  ground_truth: "テレワークを行う労働者については、事業場における勤務と同様、労働基準法に基づき、使用者が労働災害に対する補償責任を負うことから、労働契約に基づいて事業主の支配下にあることによって生じたテレワークにおける災害は、業務上の災害として労災保険給付の対象となります。"
  ideal_source:
    - text: |-
        テレワークを行う労働者については、事業場における勤務と同様、労働基準法に基づき、使用者が労働災害に対する補償責任を負うことから、労働契約に基づいて事業主の支配下にあることによって生じたテレワークにおける災害は、業務上の災害として労災保険給付の対象となります。

        ただし、私的行為等業務以外が原因であるものについては、業務上の災害とは認められません。在宅勤務を行っている労働者等、テレワークを行う労働者については、この点を十分理解していない可能性もあるため、使用者はこの点を十分周知することが望ましいです。

        また、使用者は、本誌7【2】を踏まえた労働時間の把握において、情報通信機器の使用状況などの客観的な記録や労働者から申告された時間の記録を適切に保存するとともに、労働者が負傷した場合の災害発生状況等について、使用者や医療機関等が正確に把握できるよう、当該状況等を可能な限り記録しておくことを労働者に対して周知することが望ましいです。

 