# id: simple_001
# 資料 p.7
#   ## 3 テレワークの導入に際しての留意点
#   ### 【3】 テレワークの対象者選定時の留意点
- question_id: "simple_001"
  category: "simple"
  question: "テレワークの対象者を選定するに当たっては、正規雇用労働者、非正規雇用労働者といった雇用形態の違いに基づき、対象者から除外してもよいですか？"
  ground_truth: "テレワークの対象者を選定するに当たっては、正規雇用労働者、非正規雇用労働者といった雇用形態の違いのみを理由として対象者から除外することがないようにしましょう。 雇用形態のみを理由にテレワークの対象から除外することは、パートタイム・有期雇用労働法、労働者派遣法に違反する可能性があります。"
  ideal_source:
    - text: |-
        また、短時間労働者及び有期雇用労働者の雇用管理の改善等に関する法律（平成5年法律第76号）及び労働者派遣事業の適正な運営の確保及び派遣労働者の保護等に関する法律（昭和60年法律第88号）に基づき、正規雇用労働者と非正規雇用労働者との間で、あらゆる待遇について不合理な待遇差を設けてはならないこととされています。
        テレワークの対象者を選定するに当たっては、正規雇用労働者、非正規雇用労働者といった雇用形態の違いのみを理由として対象者から除外することがないようにしましょう。
        ※ 雇用形態のみを理由にテレワークの対象から除外することは、パートタイム・有期雇用労働法、労働者派遣法に違反する可能性があります。

