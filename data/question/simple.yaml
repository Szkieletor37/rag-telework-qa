# id: simple_003
# 資料 p.7
#   ## 7. テレワークにおける労働時間管理の工夫
#   ### 【4】 テレワークに特有の様々な事象の取扱いについて
#   #### ア 中抜け時間
#   ##### 中抜け時間について Q & A
- question_id: "simple_003"
  category: "simple"
  question: "テレワークを実施する予定の労働者から、「テレワーク実施日に、銀行や役所の用事を片付けたいので、休憩時間を1時間延長して、終業時刻を1時間繰り下げたい」と言われました。労働者の都合に応じた所定労働時間の変更は可能でしょうか。"

  ground_truth: "銀行や役所の用事を済ませるための時間は、中抜け時間ですので、使用者が業務の指示をしないこととし、労働者が労働から離れ、自由に利用することが保障されている場合、終業時刻の繰り下げなどの所定労働時間の変更は可能です。ただし、あらかじめ就業規則に規定しておくことが必要です。また、企業が所定労働時間を一方的に変更することはできませんので、ご注意ください。"
  ideal_source:
    - text: |-
        **Q:** テレワークを実施する予定の労働者から、「テレワーク実施日に、銀行や役所の用事を片付けたいので、休憩時間を1時間延長して、終業時刻を1時間繰り下げたい」と言われました。労働者の都合に応じた所定労働時間の変更は可能でしょうか。
        
        **A:** 銀行や役所の用事を済ませるための時間は、中抜け時間ですので、使用者が業務の指示をしないこととし、労働者が労働から離れ、自由に利用することが保障されている場合、終業時刻の繰り下げなどの所定労働時間の変更は可能です。ただし、あらかじめ就業規則に規定しておくことが必要です。また、企業が所定労働時間を一方的に変更することはできませんので、ご注意ください。

